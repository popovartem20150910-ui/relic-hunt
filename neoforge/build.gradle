plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}
version = mod_version
group = mod_group_id
base { archivesName = 'relic-hunt-neoforge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        relic_hunt { sourceSet sourceSets.main }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: mod_version }
}
